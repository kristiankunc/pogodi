name: Dev build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            platform: x86_64-win32
            type: dir
          - name: html5
            platform: wasm-web
            type: dir
          - name: android
            platform: armv7-android
            architectures: armv7-android,arm64-android
            bundle_format: apk
            type: file

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up OpenJDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache bob.jar
        uses: actions/cache@v6
        with:
          path: bob.jar
          key: bob-1.13.1

      - name: Download bob.jar
        if: steps.cache.outputs.cache-hit != 'true'
        run: curl -fL -o bob.jar https://github.com/defold/defold/releases/download/1.13.1/bob.jar

      - name: Build and bundle
        run: |
          BF=""
          if [ -n "${{ matrix.bundle_format }}" ]; then
            BF="--bundle-format ${{ matrix.bundle_format }}"
          fi
          ARCH=""
          if [ -n "${{ matrix.architectures }}" ]; then
            ARCH="--architectures ${{ matrix.architectures }}"
          fi
          java -jar bob.jar \
            --root . \
            --archive \
            --platform "${{ matrix.platform }}" \
            $ARCH \
            $BF \
            --variant debug \
            --bundle-output "dist/${{ matrix.name }}" \
            resolve distclean build bundle

      - name: Zip bundle folder
        if: matrix.type == 'dir'
        run: |
          cd "dist/${{ matrix.name }}"
          zip -r "../nu-pogodi-${{ matrix.name }}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nu-pogodi-${{ matrix.name }}
          path: |
            dist/${{ matrix.name }}/*.zip
            dist/${{ matrix.name }}/*.apk
